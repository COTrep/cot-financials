name: Supabase keep-alive

on:
  schedule:
    - cron: "0 10 * * 1"   # Mondays 10:00 UTC
    - cron: "0 10 * * 3"   # Wednesdays 10:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cot_financials_raw?select=report_date_as_mm_dd_yyyy&limit=1")
          if [ "$STATUS" = "200" ]; then
            echo "Supabase OK (HTTP 200)"
          else
            echo "::warning::Supabase respondió HTTP $STATUS — verificar si el proyecto está pausado"
            exit 1
          fi
